const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none" aria-hidden="true">${icons[n]||icons.star}</svg>`;
const seed=()=>({me:'me',group:'po',theme:'light',quiet:false,streak:6,lastDay:'',xp:{me:740,aliya:965,timur:830,arina:655},weekly:{me:210,aliya:275,timur:190,arina:160},awarded:{},topicVotes:{},questsClaimed:{},topics:[{id:1,group:'po',subject:'Математика',title:'Квадратные уравнения',desc:'Почему у дискриминанта бывает отрицательное значение?',emoji:'📐',tone:'orange',confused:['aliya','timur'],helpers:['arina'],mastered:[]},{id:2,group:'po',subject:'Веб-дизайн',title:'Auto Layout в Figma',desc:'Как правильно настроить адаптивные карточки?',emoji:'🎨',tone:'blue',confused:['timur'],helpers:['aliya'],mastered:['arina']},{id:3,group:'po',subject:'Английский',title:'Present Perfect vs Past Simple',desc:'В каких случаях используется have done?',emoji:'🗣️',tone:'mint',confused:['arina'],helpers:['timur'],mastered:['aliya']},{id:4,group:'bio',subject:'Биология',title:'Митоз и мейоз',desc:'Чем отличаются фазы деления?',emoji:'🧬',tone:'mint',confused:['aliya'],helpers:['arina'],mastered:[]}],questions:[{id:1,group:'po',topic:1,author:'timur',text:'Можете объяснить дискриминант на простом примере?',created:1,resolved:false,answers:[{by:'arina',text:'D = b² − 4ac. Если D < 0, действительных корней нет.'}]},{id:2,group:'po',topic:2,author:'arina',text:'Как привязать кнопку к ширине контейнера?',created:2,resolved:true,answers:[{by:'aliya',text:'Помести элементы в Auto Layout и у кнопки выбери Fill container.'}]},{id:3,group:'po',topic:3,author:'aliya',text:'Есть короткая подсказка, когда использовать Present Perfect?',created:3,resolved:false,answers:[]}],tasks:[{id:1,group:'po',subject:'Веб-дизайн',title:'Собрать адаптивный экран в Figma',due:'Сегодня',done:false,verified:true,by:'aliya'},{id:2,group:'po',subject:'Математика',title:'Решить задания №5–8',due:'Завтра',done:false,verified:true,by:'timur'},{id:3,group:'po',subject:'Английский',title:'Повторить 15 новых слов',due:'Пятница',done:true,verified:true,by:'arina'},{id:4,group:'bio',subject:'Биология',title:'Повторить этапы митоза',due:'Завтра',done:false,verified:true,by:'aliya'}],messages:[{id:1,question:1,by:'timur',text:'Я запутался в знаках. Есть у кого-нибудь быстрый способ?',time:'15:03'},{id:2,question:1,by:'arina',text:'Есть! Представь, что дискриминант — это проверка количества корней 😌',time:'15:05'}],quizWins:0,focusWins:0,helps:0,notified:false});
let state;try{state=JSON.parse(localStorage.getItem('synq_demo_v3'))||seed()}catch(e){state=seed()};const profiles={me:{name:'Ты',full:'Алекс',initial:'А',skin:''},aliya:{name:'Алия',full:'Алия',initial:'А',skin:'a'},timur:{name:'Тимур',full:'Тимур',initial:'Т',skin:'b'},arina:{name:'Арина',full:'Арина',initial:'Р',skin:'c'}};if(state.names){for(const [id,name] of Object.entries(state.names)){if(profiles[id])profiles[id].full=name}}
const groups={po:{name:'ПО-24-9',school:'Твоя учебная команда',code:'SYNQ-24'},bio:{name:'BIO-10A',school:'Демо-группа',code:'BIO-10A'}};let screen='home',modal=null,topicFilter='all',taskFilter='all',chatId=1,quiz=null,focusRemaining=600,focusRunning=false,focusInterval=null,toastMsg='',toastTimer=null,confetti=false,notifyOpen=false;
function save(){try{localStorage.setItem('synq_demo_v3',JSON.stringify(state))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const today=()=>new Date().toISOString().slice(0,10);if(state.lastDay!==today()){if(state.lastDay){const gap=Math.floor((Date.now()-new Date(state.lastDay).getTime())/86400000);state.streak=gap<=2?state.streak+1:1}else state.streak=6;state.lastDay=today();save()}
function award(key,amount,label){let id=state.me+':'+key;if(state.awarded[id])return false;state.awarded[id]=true;state.xp[state.me]=(state.xp[state.me]||0)+amount;state.weekly[state.me]=(state.weekly[state.me]||0)+amount;save();notify('+'+amount+' XP · '+label,true);return true}
function notify(s,party=false){toastMsg=s;confetti=party;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastMsg='';confetti=false;render()},2500)}
function level(){return Math.floor((state.xp[state.me]||0)/200)+1}function progressLvl(){return (state.xp[state.me]||0)%200/2}
function av(id,lg=false){let p=profiles[id]||{name:id,initial:'?',skin:'c'};return `<span class="face ${p.skin||''}" style="${lg?'width:42px;height:42px;font-size:16px;':''}">${esc(p.initial)}</span>`}
function rootTitle(text,sub){return `<div class="page-head"><div class="eyebrow">SYNQ • ${groups[state.group].name}</div><div class="h-title">${text}</div>${sub?`<div class="subtitle">${sub}</div>`:''}</div>`}
function topbar(){return `<div class="topbar"><div class="top-left"><div class="mini-logo">S</div><div><div class="topline">МОЯ ГРУППА · ${groups[state.group].name}</div><div class="topname">SYNQ <span style="color:var(--purple)">✳</span></div></div></div><div class="topactions"><button class="roundbtn" data-action="notifications" aria-label="Уведомления">${ic('bell',19)}${!state.notified?'<i class="unread"></i>':''}</button><button class="roundbtn" data-action="profile" aria-label="Профиль">${ic('user',19)}</button></div></div>`}
function nav(){return `<nav class="nav" aria-label="Основные разделы">${[['home','home','Главная'],['pulse','pulse','Пульс'],['tasks','tasks','Задания'],['arena','trophy','Арена'],['profile','user','Профиль']].map(([key,icon,label])=>`<button class="${screen===key?'active':''}" data-action="navigate" data-to="${key}"><span class="nav-icon">${ic(icon,21)}</span><span class="nav-label">${label}</span>${key==='pulse'?'<i class="tiny-dot"></i>':''}</button>`).join('')}</nav>`}
function stat(icon,label,num){return `<div class="score"><div class="score-top">${ic(icon,15)}${label}</div><b>${num}</b></div>`}
function questData(){return [{id:'pulse',emoji:'🧠',title:'Укажи, что изучаешь',subtitle:'Отметь одну тему в «Пульсе»',done:!!state.awarded[state.me+':vote-'+today()],xp:30,where:'pulse'},{id:'help',emoji:'🤝',title:'Помоги одногруппнику',subtitle:'Отправь полезный ответ',done:!!state.awarded[state.me+':help-'+today()],xp:50,where:'pulse'},{id:'quiz',emoji:'⚡',title:'Пройди дневной челлендж',subtitle:'Три вопроса — одна победа',done:!!state.awarded[state.me+':quiz-'+today()],xp:60,where:'arena'}]}
function questList(){return `<div class="card card-pad">${questData().map(q=>`<div class="quest"><div class="quest-icon">${q.emoji}</div><div class="quest-meta"><strong>${q.title}</strong><span>${q.subtitle}</span></div>${q.done?`<span class="tag good">${ic('check',12)} Готово</span>`:`<button class="btn sm light" data-action="navigate" data-to="${q.where}">+${q.xp} XP</button>`}</div>`).join('')}</div>`}
function topicCardMini(t){return `<button class="card pulse-card" style="width:100%;text-align:left;cursor:pointer;color:var(--ink)" data-action="topic" data-id="${t.id}"><span class="topic-ico ${t.tone}">${t.emoji}</span><span class="grow"><span class="topic-title">${esc(t.title)}</span><span class="topic-sub" style="display:block">${esc(t.subject)} · ${t.confused.length} не поняли · ${t.helpers.length} помогут</span></span>${ic('chevron',18)}</button>`}
function home(){const top=state.topics.filter(t=>t.group===state.group).slice(0,2);return `${topbar()}<main class="container"><div style="display:flex;align-items:center;justify-content:space-between;margin-top:11px"><div><div class="eyebrow">ТВОЙ ПЛАН НА ДЕНЬ</div><div class="h-title" style="margin-top:6px">Вместе проще! <span style="font-size:27px">👋</span></div></div><span class="tag good">● в потоке</span></div><div class="hero"><div class="hero-content"><span style="background:#ffffff31;padding:5px 10px;border-radius:30px;font-size:10px;font-weight:850">✨ Ежедневная миссия</span><h2>Знания любят<br>команду.</h2><p>Помоги другу, получай XP и развивай ваш общий мир.</p><button class="white-chip" data-action="navigate" data-to="pulse">Начать миссию ${ic('chevron',15)}</button></div><div class="hero-orb"><div class="hero-smile"></div><span>synqi</span></div></div><div class="score-strip">${stat('bolt','Твои XP',state.xp[state.me])}${stat('fire','Серия',state.streak+' дней')}${stat('trophy','Уровень',level())}</div><div class="section-line"><h3 class="section-title">🔥 Пульс группы</h3><button class="linkbtn" data-action="navigate" data-to="pulse">Все темы ›</button></div>${top.map(topicCardMini).join('')}<div class="section-line"><h3 class="section-title">🎯 Миссии на сегодня</h3><span class="tiny muted">${questData().filter(x=>x.done).length}/3</span></div>${questList()}<div class="section-line"><h3 class="section-title">🌱 Ваш сад знаний</h3><button class="linkbtn" data-action="navigate" data-to="arena">Развивать ›</button></div><div class="mode-promo"><div class="outline-icon">${gardenEmoji()}</div><div class="grow"><b>Каждое объяснение — новый росток</b><span>Сегодня команда помогает друг другу</span></div><button class="roundbtn" data-action="navigate" data-to="arena" style="border:0;background:#ffffff9c;color:#547f36">${ic('chevron',17)}</button></div><div class="section-line"><h3 class="section-title">📅 Завтра не забудь</h3><button class="linkbtn" data-action="navigate" data-to="tasks">Расписание ›</button></div><div class="card card-pad" style="margin-bottom:20px"><div class="topic-title">09:00 · Веб-дизайн</div><div class="topic-sub">Разбор адаптивных интерфейсов и компонентов</div><hr class="hr"><div class="topic-title">10:40 · Математика</div><div class="topic-sub">Квадратные уравнения и практика</div></div></main>`}
function topicCard(t){const v=state.topicVotes[state.me+':'+t.id];const q=state.questions.filter(q=>q.group===state.group&&q.topic===t.id);return `<article class="card topic-full"><div style="display:flex;justify-content:space-between;align-items:center"><span class="tag">${t.emoji} ${esc(t.subject)}</span><span class="tiny muted">${q.length} вопросов</span></div><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><div class="vote-row"><button class="vote ${v==='confused'?'sel':''}" data-action="vote" data-kind="confused" data-id="${t.id}">${ic('help')} Не понял · ${t.confused.length}</button><button class="vote ${v==='helpers'?'sel':''}" data-action="vote" data-kind="helpers" data-id="${t.id}">${ic('bulb')} Объясню · ${t.helpers.length}</button><button class="vote ${v==='mastered'?'sel':''}" data-action="vote" data-kind="mastered" data-id="${t.id}">${ic('brain')} Знаю · ${t.mastered.length}</button></div><div class="topic-footer"><div class="faces">${[...t.helpers,...t.mastered].filter((e,i,a)=>a.indexOf(e)===i).slice(0,3).map(id=>av(id)).join('')}<span class="faces-label">${t.helpers.length} готовы помочь</span></div><button class="btn sm" data-action="topic" data-id="${t.id}">Открыть ${ic('chevron',14)}</button></div></article>`}
function pulse(){const list=state.topics.filter(t=>t.group===state.group&&(topicFilter==='all'||(topicFilter==='confused'?t.confused.includes(state.me):topicFilter==='helpers'?t.helpers.length:t.mastered.includes(state.me))));const q=state.questions.filter(q=>q.group===state.group&&!q.resolved).length;return `${topbar()}${rootTitle('Пульс группы 🧠','Узнай, кто что понял, и найди помощь без лишних сообщений.')}<section class="container"><div class="mini-stats"><div class="s"><b>${state.topics.filter(t=>t.group===state.group).length}</b><span>Темы</span></div><div class="s"><b>${state.topics.filter(t=>t.group===state.group).reduce((x,t)=>x+t.confused.length,0)}</b><span>Нужна помощь</span></div><div class="s"><b>${q}</b><span>Открытые вопросы</span></div></div><div class="chips">${[['all','Все темы'],['confused','Не понял'],['helpers','Есть помощники'],['mastered','Знаю']].map(([k,l])=>`<button class="chip ${topicFilter===k?'active':''}" data-action="filter-topic" data-value="${k}">${l}</button>`).join('')}</div>${list.length?list.map(topicCard).join(''):`<div class="empty"><div class="empty-icon">🌱</div><h3>Пока здесь тихо</h3>Ты можешь создать новую тему или изменить фильтр.</div>`}<div class="section-line"><h3 class="section-title">💬 Нужна помощь?</h3><button class="linkbtn" data-action="navigate" data-to="help">Все вопросы ›</button></div>${state.questions.filter(q=>q.group===state.group&&!q.resolved).slice(0,2).map(q=>`<div class="card card-pad" style="margin:8px 0"><div style="display:flex;gap:9px;align-items:center">${av(q.author)}<span class="small bold">${esc(profiles[q.author]?.name||'Студент')}</span><span class="tiny muted">ищет помощь</span></div><p class="small" style="line-height:1.5">${esc(q.text)}</p><button class="btn light sm" data-action="chat" data-id="${q.id}">Помочь ${ic('chat',14)}</button></div>`).join('')}<button class="btn fab" data-action="new-topic">${ic('plus')} Создать тему</button></section>`}
function topicDetail(){let t=state.topics.find(x=>x.id===Number(chatId))||state.topics[0];const qs=state.questions.filter(q=>q.topic===t.id);return `<div class="backbar"><button class="iconbtn" data-action="navigate" data-to="pulse">${ic('left')}</button><div class="grow"><h2>${t.emoji} ${esc(t.subject)}</h2><div class="tiny muted">Тема группы ${groups[t.group]?.name||''}</div></div><button class="iconbtn" data-action="report" data-id="${t.id}">${ic('flag',18)}</button></div><div class="container"><div class="card card-pad" style="margin-top:8px"><div class="eyebrow">ПУЛЬС ПОНИМАНИЯ</div><h2 style="font-size:24px;letter-spacing:-1px;margin:12px 0 6px">${esc(t.title)}</h2><p class="small muted" style="line-height:1.6">${esc(t.desc)}</p><div class="mini-stats"><div class="s"><b>${t.confused.length}</b><span>Не поняли</span></div><div class="s"><b>${t.helpers.length}</b><span>Помогут</span></div><div class="s"><b>${t.mastered.length}</b><span>Освоили</span></div></div><div class="vote-row" style="flex-wrap:wrap"><button class="vote" data-action="vote" data-kind="confused" data-id="${t.id}">❓ Не понял</button><button class="vote" data-action="vote" data-kind="helpers" data-id="${t.id}">💡 Объясню</button><button class="vote" data-action="vote" data-kind="mastered" data-id="${t.id}">✅ Знаю</button></div></div><div class="section-line"><h3 class="section-title">Вопросы по теме</h3><span class="tiny muted">${qs.length} всего</span></div>${qs.map(q=>`<div class="card card-pad" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px">${av(q.author)}<b class="small">${esc(profiles[q.author]?.name||'Студент')}</b><span class="tag ${q.resolved?'good':'warn'}" style="margin-left:auto">${q.resolved?'Решено':'Ждет ответа'}</span></div><p class="small" style="line-height:1.5">${esc(q.text)}</p><button class="btn light sm" data-action="chat" data-id="${q.id}">Открыть обсуждение ${ic('chevron',13)}</button></div>`).join('')||`<div class="empty"><div class="empty function helpList(){let qs=state.questions.filter(q=>q.group===state.group);return `<div class="backbar"><button class="iconbtn" data-action="navigate" data-to="pulse">${ic('left')}</button><h2>HelpMatch 🤝</h2></div>${rootTitle('Помогай. Узнавай. Расти.','Ответы от реальных одногруппников, без бесконечного чата.')}<div class="container"><div class="info-card"><b>Как это работает?</b><br>Открой вопрос, помоги разобраться и получи XP. Отметка «решено» сохраняет результат всей группе.</div><div class="section-line"><h3 class="section-title">Открытые вопросы</h3><span class="tiny muted">${qs.filter(q=>!q.resolved).length} ожидают помощи</span></div>${qs.sort((a,b)=>Number(a.resolved)-Number(b.resolved)).map(q=>`<div class="card card-pad" style="margin:10px 0"><div style="display:flex;align-items:center;gap:8px">${av(q.author)}<b class="small">${esc(profiles[q.author]?.name||'Участник')}</b><span class="tag ${q.resolved?'good':'warn'}" style="margin-left:auto">${q.resolved?'Решено':'Нужна помощь'}</span></div><p class="small" style="line-height:1.55">${esc(q.text)}</p><span class="tiny muted">${q.answers.length} ответов</span><button class="btn sm full ${q.resolved?'light':''}" style="margin-top:12px" data-action="chat" data-id="${q.id}">${q.resolved?'Посмотреть решение':'Подключиться'} ${ic('chevron',14)}</button></div>`).join('')}<button class="btn full" data-action="new-question" style="margin:17px 0">${ic('plus')} Задать свой вопрос</button></div>`}
function tasks(){let tasks=state.tasks.filter(t=>t.group===state.group&&(taskFilter==='all'||(taskFilter==='active'?!t.done:t.done)));let complete=state.tasks.filter(t=>t.group===state.group&&t.done).length,total=state.tasks.filter(t=>t.group===state.group).length;return `${topbar()}${rootTitle('Задания ✏️','Все домашние задания группы — в одном месте.')}<section class="container"><div class="card card-pad" style="margin:10px 0 18px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px"><b style="font-size:14px">Твой учебный ритм</b><span class="tag good">${complete}/${total} готово</span></div><div class="progress"><b style="width:${total?100*complete/total:0}%"></b></div><p class="tiny muted" style="margin:10px 0 0">Маленький шаг тоже считается. Не перегружай себя 💜</p></div><div class="chips">${[['all','Все'],['active','Нужно сделать'],['done','Готово']].map(([k,l])=>`<button class="chip ${taskFilter===k?'active':''}" data-action="filter-task" data-value="${k}">${l}</button>`).join('')}</div>${tasks.map(t=>`<div class="card task ${t.done?'done':''}"><button class="checkbox ${t.done?'checked':''}" data-action="task-toggle" data-id="${t.id}" aria-label="Изменить выполнение">${t.done?ic('check',16):''}</button><div class="grow"><div class="topic-title">${esc(t.title)}</div><div class="topic-sub">${esc(t.subject)} ${t.verified?'· ✓ Проверено группой':''}</div><div class="task-actions"><span class="date-bubble ${t.done?'ok':''}">${esc(t.due)}</span><button data-action="edit-task" data-id="${t.id}">Изменить</button><button data-action="delete-task" data-id="${t.id}">Удалить</button></div></div></div>`).join('')||'<div class="empty">Здесь пока ничего нет 🎉</div>'}<div class="btn-row" style="margin:20px 0"><button class="btn" data-action="new-task">${ic('plus')} Добавить задание</button><button class="btn light" data-action="schedule">${ic('calendar')} Пары</button></div><div class="info-card">🔒 Это учебный прототип. Задания сохраняются в этом браузере, но пока не синхронизируются с колледжем или другими устройствами.</div></section>`}
function gardenEmoji(){const x=(state.helps||0)+(state.quizWins||0)+(state.focusWins||0);return x<1?'🌱':x<3?'🌿':x<6?'🌻':'🌳'}
function arena(){const people=Object.keys(profiles).map(id=>({id,points:state.weekly[id]||0})).sort((a,b)=>b.points-a.points);return `${topbar()}${rootTitle('Арена побед 🏆','Соревнуйся дружелюбно. Знания — командная игра.')}<section class="container"><div class="level-card"><div class="eyebrow" style="color:#b6f38e">ТВОЙ ЛИЧНЫЙ ПРОГРЕСС</div><div style="display:flex;align-items:baseline;gap:9px;margin:8px 0 6px"><div class="level-number">${level()}</div><b>уровень · Исследователь</b></div><div class="progress"><b style="width:${progressLvl()}%"></b></div><div style="font-size:11px;color:#dedbf8;margin-top:8px">${state.xp[state.me]} XP · до следующего уровня ${200-(state.xp[state.me]%200)} XP</div></div><div class="section-line"><h3 class="section-title">⚡ Дневной челлендж</h3><span class="tag">+60 XP</span></div><div class="card card-pad" style="display:flex;gap:14px;align-items:center"><div style="font-size:48px">🧩</div><div class="grow"><b style="font-size:14px">Битва с Боссом</b><p class="small muted" style="line-height:1.35;margin:6px 0 11px">3 быстрых вопроса, 1 награда, 0 давления.</p><button class="btn sm" data-action="quiz-start">Начать ${ic('bolt',15)}</button></div></div><div class="section-line"><h3 class="section-title">🌸 Сад знаний</h3><span class="tag good">Командный прогресс</span></div><div class="garden"><div class="sun"></div><div class="cloud"></div><div class="plant">${gardenEmoji()}</div></div><div class="small muted" style="margin-top:10px;line-height:1.45">Каждая помощь, учебная миссия и осознанная пауза помогает саду расти.</div>${state.quiet?`<div class="info-card" style="margin-top:20px">🌿 <b>Щадящий режим включён.</b> Лига скрыта, чтобы можно было учиться в своём темпе.</div>`:`<div class="section-line"><h3 class="section-title">🏅 Лига недели</h3><span class="tiny muted">Без штрафов за пропуски</span></div><div class="card card-pad" style="padding:7px">${people.map((p,i)=>`<div class="leader ${p.id===state.me?'me':''}"><span class="leader- function profile(){const n=profiles[state.me],help=state.helps||0;return `${topbar()}${rootTitle('Твой космос ✨','Твой прогресс принадлежит тебе.')}<section class="container"><div class="card profile-card" style="margin-top:12px"><div class="avatar-lg">${n.initial}</div><div class="grow"><div style="font-size:20px;font-weight:950;letter-spacing:-.6px">${esc(n.full)}</div><div class="small muted" style="margin-top:5px">${esc(groups[state.group].name)} · уровень ${level()}</div><span class="tag good" style="margin-top:8px">🌟 Участник сообщества</span></div><button class="iconbtn" data-action="edit-profile">${ic('edit',17)}</button></div><div class="metric3"><div><b>${state.xp[state.me]}</b><span>Всего XP</span></div><div><b>${help}</b><span>Помощь другим</span></div><div><b>${state.streak}</b><span>Дней подряд</span></div></div><div class="section-line"><h3 class="section-title">Твоё сообщество</h3></div><div class="card card-pad"><div style="display:flex;align-items:center;gap:12px"><div class="topic-ico mint">🎓</div><div class="grow"><div class="topic-title">${esc(groups[state.group].name)}</div><div class="topic-sub">Закрытая группа · код: ${groups[state.group].code}</div></div></div><div class="btn-row" style="margin-top:13px"><button class="btn light sm" data-action="copy-code">${ic('copy',14)} Код группы</button><button class="btn outline sm" data-action="change-group">${ic('users',14)} Сменить</button></div></div><div class="section-line"><h3 class="section-title">Настройки и безопасность</h3></div><div class="card card-pad"><button class="setting" data-action="theme">${ic(state.theme==='dark'?'sun':'moon')} ${state.theme==='dark'?'Светлая тема':'Тёмная тема'} ${ic('chevron',16)}</button><button class="setting" data-action="quiet">${ic('heart')} Щадящий режим <span style="margin-left:auto;color:var(--green);font-size:11px">${state.quiet?'Вкл':'Выкл'}</span>${ic('chevron',16)}</button><button class="setting" data-action="privacy">${ic('shield')} Приватность и модерация ${ic('chevron',16)}</button><button class="setting" data-action="change-account">${ic('users')} Демо: сменить участника ${ic('chevron',16)}</button><button class="setting" data-action="reset">${ic('refresh')} Сбросить демоданные ${ic('chevron',16)}</button></div><div class="info-card" style="margin:19px 0">Это <b>интерактивная демонстрация</b>. Данные хранятся только в этом браузере. Реальная многопользовательская работа и вход через сервер ещё не подключены.</div></section>`}
function schedule(){const slots=[['09:00','Веб-дизайн','Практика адаптивных интерфейсов'],['10:40','Математика','Квадратные уравнения'],['12:20','Английский язык','Perfect и Past Simple'],['14:00','Самостоятельная работа','Командный проект']];return `<div class="backbar"><button class="iconbtn" data-action="navigate" data-to="tasks">${ic('left')}</button><h2>Расписание</h2></div>${rootTitle('Завтра по плану 📅','Демонстрационное расписание группы.')}<div class="container"><div class="timeline">${slots.map(s=>`<div class="slot"><span>${s[0]}</span><strong>${s[1]}</strong><div class="tiny muted" style="margin-top:4px">${s[2]}</div></div>`).join('')}</div><div class="info-card">Настоящее расписание можно будет интегрировать с системой колледжа в будущей версии.</div></div>`}
function focus(){let mm=String(Math.floor(focusRemaining/60)).padStart(2,'0'),ss=String(focusRemaining%60).padStart(2,'0');return `<div class="backbar"><button class="iconbtn" data-action="focus-back">${ic('left')}</button><h2>Режим фокуса</h2></div><div class="container"><div style="height:200px;display:grid;place-items:center;font-size:96px;margin-top:24px">🪴</div><div class="eyebrow" style="text-align:center">ТИШИНА И КОНЦЕНТРАЦИЯ</div><div class="countdown">${mm}:${ss}</div><div class="quiet-note">Только один маленький шаг. Этого достаточно.</div><div class="btn-row"><button class="btn ${focusRunning?'light':''}" data-action="focus-toggle">${ic(focusRunning?'pause':'play')} ${focusRunning?'Пауза':'Продолжить'}</button><button class="btn outline" data-action="focus-reset">${ic('refresh')} Сброс</button></div><div class="info-card" style="margin-top:24px"><b>Без давления.</b> Таймер нужен не для рейтинга. Если закончишь сессию, получишь один бонус XP за день.</div></div>`}
function chat(){const q=state.questions.find(q=>q.id===chatId);if(!q){screen='help';return helpList()}const msgs=state.messages.filter(x=>x.question===q.id);return `<div class="backbar"><button class="iconbtn" data-action="navigate" data-to="help">${ic('left')}</button><div class="grow"><h2>${esc(profiles[q.author]?.name||'Вопрос')} · HelpMatch</h2><div class="tiny muted">Закрытая учебная группа</div></div><button class="iconbtn" data-action="report" data-id="${q.id}">${ic('flag',17)}</button></div><div class="container"><div class="info-card">💬 ${esc(q.text)}<br><span style="opacity:.8">Вопрос ${q.resolved?'уже решён ✅':'пока открыт'}</span></div><div style="margin:11px 0 4px">${av(q.author)} <span class="small bold">${esc(profiles[q.author]?.name||'Участник')}</span> <span class="tiny muted"> задал вопрос</span></div></div><div class="chat-list">${msgs.map(m=>`<div class="bubble ${m.by===state.me?'me':''}"><span class="who">${esc(profiles[m.by]?.name||'Участник')} · ${m.time}</span>${esc(m.text)}</div>`).join('')}<div class="bubble" style="background:var(--lilac);border:0"><span class="who">💡 SYNQ Совет</span>Объясняй шагами и задавай уточняющий вопрос, вместо того чтобы просто дать готовый ответ.</div></div><div class="container" style="margin-bottom:90px"><div class="btn-row"><button class="btn sm light" data-action="solve-question" data-id="${q.id}" ${q.resolved?'disabled':''}>${ic('check',14)} ${q.resolved?'Решено':'Отметить решённым'}</button><button class="btn sm outline" data-action="report" data-id="${q.id}">${ic('flag',14)} Жалоба</button></div></div><form id="chat-form" class="chat-composer"><input class="field" name="message" maxlength="500" placeholder="Объяснить по-доброму..." autocomplete="off" required aria-label="Сообщение"><button class="btn" type="submit" aria-label="Отправить">${ic('send',19)}</button></form>`}
function quizView(){const bank=[{q:'Чему равен дискриминант у x² − 5x + 6 = 0?',a:['D = 1','D = 25','D = 6'],correct:0,why:'D = (−5)² − 4 · 1 · 6 = 25 − 24 = 1.'},{q:'Что делает Auto Layout в Figma?',a:['Удаляет слои','Управляет расположением элементов','Создаёт анимации'],correct:1,why:'Auto Layout управляет отступами, выравниванием и потоком элементов.'},{q:'Выбери верный Present Perfect:',a:['I have finished','I has finish','I finished yesterday'],correct:0,why:'Для I/you/we/they используется have + третья форма глагола.'}];const cur=bank[quiz.step];let done=quiz.step===3;return `<div class="backbar"><button class="iconbtn" data-action="quiz-exit">${ic('left')}</button><div class="grow"><h2>⚡ Битва с Боссом</h2><div class="tiny muted">Режим знаний</div></div><span class="tag">${Math.min(quiz.step+1,3)}/3</span></div><div class="container"><div class="progress" style="margin:10px 0 25px;height:10px"><b style="width:${(quiz.step/3)*100}%"></b></div>${done?`<div style="font-size:90px;text-align:center;margin:35px 0">${quiz.score>=2?'🏆':'🌟'}</div><h1 class="h-title" style="text-align:center">${quiz.score>=2?'Победа!':'Ты стал сильнее!'}</h1><p class="subtitle" style="text-align:center">Верных ответов: ${quiz.score}/3. ${quiz.score>=2?'Ты отлично справился!':'Ошибки — это часть обучения.'}</p><div class="card card-pad" style="text-align:center;margin:25px 0"><b style="font-size:29px;color:var(--purple)">${quiz.score>=2?'+60 XP':'+20 XP'}</b><div class="tiny muted">Награда за первую сегодняшнюю попытку</div></div><button class="btn full" data-action="quiz-finish">Вперёд к новым знаниям ${ic('chevron',16)}</button>`:`<div class="eyebrow">ВОПРОС ${quiz.step+1} ИЗ 3</div><h2 style="font-size:23px;letter-spacing:-.8px;line-height:1.35;margin:18px 0 22px">${cur.q}</h2><div class="answers">${cur.a.map((a,i)=>`<button class="answer ${quiz.choice===i?'selected':''} ${quiz.locked&&i===cur.correct?'correct':''} ${quiz.locked&&quiz.choice===i&&i!==cur.correct?'wrong':''}" data-action="quiz-answer" data-id="${i}" ${quiz.locked?'disabled':''}>${['А','Б','В'][i]}. ${a}</button>`).join('')}</div>${quiz.locked?`<div class="info-card" style="margin:12px 0"><b>${quiz.choice===cur.correct?'Правильно! 🎉':'Это нормально. Разберём вместе 🧠'}</b><br>${cur.why}</div>`:''}<button class="btn full" data-action="quiz-next" ${!quiz.locked?'disabled':''} style="margin-top:19px">${quiz.step===2?'Посмотреть результат':'Дальше'} ${ic('chevron',18)}</button>`}</div>`}

if(t.kind==='topic'){title='Создать новую тему';body=`<form id="topic-form">${text('Название темы','title','Например, HTML и CSS')}${text('Предмет','subject','Веб-дизайн')}${area('В чём сложность?','desc','Опиши, что хочется понять') }<div class="form-buttons"><button class="btn full" type="submit">Опубликовать в группе +20 XP</button></div></form>`}
if(t.kind==='question'){title='Спросить у группы';let choices=state.topics.filter(x=>x.group===state.group).map(x=>`<option value="${x.id}" ${t.topic===x.id?'selected':''}>${esc(x.title)}</option>`).join('');body=`<form id="question-form"><label class="field-label">Тема</label><select class="field" name="topic">${choices}</select>${area('Твой вопрос','text','Что именно тебе непонятно?')}<div class="info-card" style="margin-top:13px">Вопрос увидят только участники учебной группы. Будь доброжелателен 💜</div><div class="form-buttons"><button class="btn full" type="submit">Отправить вопрос ${ic('send',16)}</button></div></form>`}
if(t.kind==='task'){title=t.id?'Изменить задание':'Добавить задание';let v=state.tasks.find(x=>x.id===t.id)||{};body=`<form id="task-form"><input type="hidden" name="task-id" value="${v.id||''}">${text('Что нужно сделать?','title','Например, подготовить доклад',v.title||'')}${text('Предмет','subject','Математика',v.subject||'')}<label class="field-label">Срок выполнения</label><select class="field" name="due">${['Сегодня','Завтра','Пятница','Следующая неделя'].map(x=>`<option ${v.due===x?'selected':''}>${x}</option>`).join('')}</select><div class="form-buttons"><button class="btn full" type="submit">${t.id?'Сохранить изменения':'Добавить всей группе'}</button></div></form>`}
if(t.kind==='group'){title='Мои сообщества';body=`<div class="info-card">🔒 В реальном SYNQ комнаты должны подтверждаться школой/колледжем. Здесь две демонстрационные группы.</div>${Object.entries(groups).map(([id,g])=>`<button class="card pulse-card" style="width:100%;margin-top:12px;color:var(--ink)" data-action="set-group" data-id="${id}"><span class="topic-ico">🎓</span><span class="grow" style="text-align:left"><b>${g.name}</b><span class="topic-sub" style="display:block">Код: ${g.code}</span></span>${id===state.group?ic('check',20):ic('chevron',20)}</button>`).join('')}`}
if(t.kind==='account'){title='Демо-участники';body=`<div class="info-card">Переключайся между участниками, чтобы проверить: ответы, голосования и прогресс каждой роли сохраняются локально.</div>${Object.entries(profiles).map(([id,p])=>`<button class="card pulse-card" style="width:100%;margin-top:12px;color:var(--ink)" data-action="set-account" data-id="${id}">${av(id,true)}<span class="grow" style="text-align:left"><b>${p.full}</b><span class="topic-sub" style="display:block">${id==='me'?'Основной аккаунт':'Демонстрационный участник'}</span></span>${state.me===id?ic('check'):ic('chevron')}</button>`).join('')}`}
if(t.kind==='profile'){title='Как тебя зовут?';body=`<form id="profile-form">${text('Имя','name','Как к тебе обращаться?',profiles[state.me].full)}<div class="form-buttons"><button class="btn full" type="submit">Сохранить</button></div></form>`}
if(t.kind==='match'){const tp=state.topics.find(x=>x.id===t.topic);title='Твой HelpMatch 🤝';body=`<div class="info-card"><b>Тема: ${esc(tp?.title||'')}</b><br>Здесь видно, кто добровольно указал «Могу объяснить».</div>${(tp?.helpers||[]).filter(x=>x!==state.me).map(id=>`<div class="card pulse-card">${av(id,true)}<div class="grow"><b>${esc(profiles[id]?.full||'Участник')}</b><div class="topic-sub">Готов помочь разобраться</div></div><button class="btn sm" data-action="new-question" data-topic="${t.topic}">Спросить</button></div>`).join('')||`<div class="empty">Пока нет доступных помощников. Опубликуй вопрос в группе — и кто-то откликнется.</div>`}<button class="btn full" data-action="new-question" data-topic="${t.topic}">Создать вопрос</button>`}
if(t.kind==='privacy'){title='Правила и приватность';body=`<div class="info-card" style="margin-bottom:15px"><b>Безопасное учебное пространство</b><br>Доступ по приглашению, добровольная помощь, отсутствие публичного рейтинга «слабых» учеников.</div><p class="small" style="line-height:1.75">• «Не понял» отображается агрегированно, без публичного списка отметившихся.<br>• Вопросы видны только внутри выбранной учебной группы.<br>• Можно пожаловаться на контент через значок флага.<br>• Соревнование касается полезных действий, а не оценок.<br>• В демоверсии жалобы сохраняются только локально; серверной модерации нет.<br>• Для реального запуска с несовершеннолетними потребуются верификация, модераторы, ограничения контактов и политика конфиденциальности.</p><button class="btn full" data-action="close-modal">Понятно</button>`}
if(t.kind==='report'){title='Пожаловаться на контент';body=`<form id="report-form"><input type="hidden" name="id" value="${t.id||0}"><label class="field-label">Причина</label><select class="field" name="reason"><option>Оскорбление или травля</option><option>Спам или реклама</option><option>Опасный контент</option><option>Другое</option></select><div class="info-card" style="margin-top:13px">Демо: жалоба фиксируется только в браузере. Для реальных жалоб потребуется модерация на сервере.</div><div class="form-buttons"><button class="btn full" type="submit">Зафиксировать жалобу</button></div></form>`}
if(t.kind==='reset'){title='Сбросить данные?';body=`<p class="small muted">Это удалит все изменения в текущем браузере: XP, ваши темы, ответы, задания и достижения. Демоданные будут восстановлены.</p><div class="btn-row"><button class="btn outline" data-action="close-modal">Отмена</button><button class="btn" data-action="reset-confirm">Сбросить</button></div>`}
return `<div class="modal-veil" id="veil"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="iconbtn" data-action="close-modal" aria-label="Закрыть">${ic('close',19)}</button></div>${body}</div></div>`}
function render(){document.documentElement.dataset.theme=state.theme;let page=screen==='home'?home():screen==='pulse'?pulse():screen==='topic'?topicDetail():screen==='help'?helpList():screen==='tasks'?tasks():screen==='arena'?arena():screen==='profile'?profile():screen==='schedule'?schedule():screen==='chat'?chat():screen==='quiz'?quizView():screen==='focus'?focus():screen==='notifications'?notifications():home();const hiddenNav=['chat','quiz','focus'].includes(screen);document.getElementById('app').innerHTML=`<div class="desktop"><aside class="pitch"><div class="pitch-logo"><span class="brand-icon">S</span>SYNQ<span style="color:#6c55ef">✳</span></div><h1>Учись.<br>Помогай.<br><span>Побеждай.</span></h1><p>Не ещё один чат для домашки. Живая учебная команда, в которой понимание превращается в прогресс — твой и общий.</p><div class="pitch-pills"><span>⚡ Геймификация</span><span>🤝 HelpMatch</span><span>🧠 Пульс понимания</span><span>🌱 Сад знаний</span></div><div class="pitch-footer">SYNQ • Интерактивный продуктовый прототип 2026<br>Данные сохраняются локально. Сервер не требуется.</div></aside><div class="phone-frame"><div class="phone"><div class="status"><span>9:41</span><span class="r">${ic('pulse',13)} ${ic('bolt',13)} ▰</span></div><div class="view" id="view">${page}</div>${hiddenNav?'':nav()}${renderModal()}${toastMsg?`<div class="toast">${ic('spark',20)} ${esc(toastMsg)}</div>`:''}${confetti?`<div class="confetti">${Array.from({length:30},(_,i)=>`<i style="left:${(i*37)%98}%;background:${['#c4f27e','#8d7cff','#ffb96d','#79c9f3'][i%4]};animation-delay:${(i%7)*.08}s;transform:rotate(${i*28}deg)"></i>`).join('')}</div>`:''}</div></div></div>`;if(screen==='chat'){const v=document.getElementById('view');if(v)v.scrollTop=v.scrollHeight}}
function route(to){screen=to;modal=null;if(to==='quiz'&&!quiz)screen='arena';render();let v=document.getElementById('view');if(v&&screen!=='chat')v.scrollTop=0}
function vote(topicId,kind){const t=state.topics.find(x=>x.id===topicId);if(!t)return;let key=state.me+':'+topicId;let old=state.topicVotes[key];if(old===kind){t[kind]=t[kind].filter(x=>x!==state.me);delete state.topicVotes[key];notify('Отметка убрана');}else{if(old)t[old]=t[old].filter(x=>x!==state.me);for(const k of ['confused','helpers','mastered'])t[k]=t[k].filter(x=>x!==state.me);t[kind].push(state.me);state.topicVotes[key]=kind;if(!state.awarded[state.me+':vote-'+today()])award('vote-'+today(),30,'Миссия «Пульс»');else notify('Пульс обновлён 💜')}save();render()}
function action(el){const a=el.dataset.action,id=Number(el.dataset.id);if(a==='navigate')return route(el.dataset.to);if(a==='profile')return route('profile');if(a==='notifications'){state.notified=true;save();return route('notifications')};if(a==='filter-topic'){topicFilter=el.dataset.value;return render()};if(a==='filter-task'){taskFilter=el.dataset.value;return render()};if(a==='vote')return vote(id,el.dataset.kind);if(a==='topic'){chatId=id;return route('topic')};if(a==='new-topic'){modal={kind:'topic'};return render()};if(a==='new-question'){modal={kind:'question',topic:Number(el.dataset.topic)||null};return render()};if(a==='match'){modal={kind:'match',topic:Number(el.dataset.topic)};return render()};if(a==='chat'){chatId=id;return route('chat')};if(a==='new-task'){modal={kind:'task'};return render()};if(a==='edit-task'){modal={kind:'task',id};return render()};if(a==='delete-task'){state.tasks=state.tasks.filter(t=>t.id!==id);save();return notify('Задание удалено')};if(a==='task-toggle'){let t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;if(t.done)award('task-'+t.id,15,'Задание выполнено');else notify('Задание снова в списке');save();render()}return};if(a==='schedule')return route('schedule');if(a==='quiz-start'){quiz={step:0,score:0,choice:null,locked:false};return route('quiz')};if(a==='quiz-answer'){if(!quiz||quiz.locked)return;quiz.choice=id;quiz.locked=true;const right=[0,1,0][quiz.step];if(id===right)quiz.score++;return render()};if(a==='quiz-next'){quiz.step++;quiz.choice=null;quiz.locked=false;return render()};if(a==='quiz-finish'){let pts=quiz.score>=2?60:20;if(!state.awarded[state.me+':quiz-'+today()]){award('quiz-'+today(),pts,'Битва с Боссом');state.quizWins=(state.quizWins||0)+1}else notify('Ещё одна тренировка!');quiz=null;save();return route('arena')};if(a==='quiz-exit'){quiz=null;return route('arena')};if(a==='focus'){focusRemaining=600;focusRunning=false;return route('focus')};if(a==='focus-toggle'){focusRunning=!focusRunning;if(focusRunning){focusInterval=setInterval(()=>{if(screen==='focus'&&focusRunning){focusRemaining--;if(focusRemaining<=0){focusRunning=false;clearInterval(focusInterval);state.focusWins++;save();award('focus-'+today(),40,'Фокус-сессия завершена');route('arena')}else render()}},1000)}else clearInterval(focusInterval);return render()};if(a==='focus-reset'){focusRunning=false;clearInterval(focusInterval);focusRemaining=600;return render()};if(a==='focus-back'){focusRunning=false;clearInterval(focusInterval);return route('arena')};if(a==='solve-question'){let q=state.questions.find(x=>x.id===id);if(q&&!q.resolved){q.resolved=true;save();return notify('Решение сохранено ✅')}return};if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();return render()};if(a==='quiet'){state.quiet=!state.quiet;save();return notify(state.quiet?'Щадящий режим включён 🌿':'Обычный режим включён')};if(a==='privacy'){modal={kind:'privacy'};return render()};if(a==='report'){modal={kind:'report',id};return render()};if(a==='copy-code'){let code=groups[state.group].code;if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>notify('Код скопирован: '+code)).catch(()=>notify('Код группы: '+code));else notify('Код группы: '+code);return};if(a==='change-group'){modal={kind:'group'};return render()};if(a==='change-account'){modal={kind:'account'};return render()};if(a==='set-group'){state.group=el.dataset.id;modal=null;save();topicFilter='all';return notify('Группа: '+groups[state.group].name)};if(a==='set-account'){state.me=el.dataset.id;modal=null;save();return notify('Ты теперь: '+profiles[state.me].full)};if(a==='edit-profile'){modal={kind:'profile'};return render()};if(a==='reset'){modal={kind:'reset'};return render()};if(a==='reset-confirm'){state=seed();state.lastDay=today();save();screen='home';modal=null;return notify('Демо восстановлено')};if(a==='close-modal'){modal=null;return render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();action(b)}else if(e.target.id==='veil'){modal=null;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const d=new FormData(form);if(form.id==='topic-form'){let t={id:Math.max(0,...state.topics.map(x=>x.id))+1,group:state.group,subject:String(d.get('subject')).trim(),title:String(d.get('title')).trim(),desc:String(d.get('desc')).trim(),emoji:'📚',tone:'blue',confused:[],helpers:[],mastered:[]};if(!t.title||!t.subject)return;state.topics.unshift(t);modal=null;award('topic-'+t.id,20,'Новая тема');save();route('pulse')}if(form.id==='question-form'){const topic=Number(d.get('topic'));const q={id:Math.max(0,...state.questions.map(x=>x.id))+1,group:state.group,topic,author:state.me,text:String(d.get('text')).trim(),created:Date.now(),resolved:false,answers:[]};if(!q.text)return;state.questions.unshift(q);modal=null;save();notify('Вопрос опубликован! 💬');route('help')}if(form.id==='task-form'){let id=Number(d.get('task-id')),t=state.tasks.find(x=>x.id===id);if(t){t.title=String(d.get('title')).trim();t.subject=String(d.get('subject')).trim();t.due=String(d.get('due'))}else{state.tasks.unshift({id:Math.max(0,...state.tasks.map(x=>x.id))+1,group:state.group,title:String(d.get('title')).trim(),subject:String(d.get('subject')).trim(),due:String(d.get('due')),done:false,verified:false,by:state.me})}save();modal=null;notify('Задание сохранено ✅');route('tasks')}if(form.id==='chat-form'){let txt=String(d.get('message')||'').trim();if(!txt)return;state.messages.push({id:Date.now(),question:chatId,by:state.me,text:txt,time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})});const q=state.questions.find(x=>x.id===chatId);if(q){q.answers.push({by:state.me,text:txt})}state.helps=(state.helps||0)+1;award('help-'+today(),50,'Ты помог одногруппнику');save();render()}if(form.id==='profile-form'){profiles[state.me].full=String(d.get('name')).trim().slice(0,40)||profiles[state.me].full;state.names=state.names||{};state.names[state.me]=profiles[state.me].full;save();modal=null;notify('Профиль обновлён')}if(form.id==='report-form'){const report={id:Number(d.get('id')),reason:String(d.get('reason')),by:state.me,date:Date.now()};state.reports=state.reports||[];state.reports.push(report);save();modal=null;notify('Жалоба сохранена в демо')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}render();
})();
</script>
</body>
